# Builds the Windows installers and publishes them as a GitHub Release when a
# version tag (for example v1.1.0) is pushed. Installed copies of Inkstone check
# these releases for updates.
#
# Optional code signing: add repository secrets CSC_LINK (base64 of your .pfx code
# signing certificate) and CSC_KEY_PASSWORD. Without them the builds are unsigned.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $want"; exit 1; fi

      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Without a certificate, make sure electron-builder doesn't try to sign.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx vite build
          # The publish settings make electron-builder write the update feed (latest.yml);
          # uploading is done in the next step so both installers go into one release.
          npx electron-builder --win nsis portable --publish never \
            --config.publish.provider=github \
            --config.publish.owner="${GITHUB_REPOSITORY%/*}" \
            --config.publish.repo="${GITHUB_REPOSITORY#*/}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(
            "release/Inkstone-Setup-${version}.exe"
            "release/Inkstone-Setup-${version}.exe.blockmap"
            "release/Inkstone-Portable-${version}.exe"
            "release/latest.yml"
          )
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "Missing $f"; exit 1; }; done
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Inkstone ${version}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
